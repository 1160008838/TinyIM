name: tinyim
description: TinyIM - LAN Peer-to-Peer Instant Messaging App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.2
  
  # Networking
  http: ^1.1.0
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # File System
  path_provider: ^2.1.1
  
  # Media
  image_picker: ^1.0.4
  file_picker: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # State Management
  provider: ^6.1.1
  get_it: ^7.6.4
  
  # Permissions
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
  
  # Fonts (可选)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
